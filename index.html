<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Module Drill Portal</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #22c55e;
      --error: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; }
    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; max-width: 640px; width: 100%; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; text-align: center; color: var(--accent); }
    p.subtitle { color: var(--muted); text-align: center; margin-bottom: 1.5rem; font-size: 0.95rem; }
    .btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.75rem; margin-bottom: 1.5rem; }
    button { background: #334155; color: var(--text); border: 1px solid var(--border); padding: 0.75rem 1rem; border-radius: 8px; cursor: pointer; font-size: 0.95rem; font-weight: 600; transition: all 0.2s ease; }
    button:hover { background: #475569; }
    button.primary { background: var(--accent); color: #0f172a; border: none; width: 100%; padding: 0.85rem; }
    button.primary:hover { opacity: 0.9; }
    
    /* Quiz View */
    .progress-bar { background: var(--border); border-radius: 999px; height: 8px; overflow: hidden; margin-bottom: 1.25rem; }
    .progress-fill { background: var(--accent); height: 100%; width: 0%; transition: width 0.3s ease; }
    .meta { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
    .question-title { font-size: 1.15rem; font-weight: 600; line-height: 1.5; margin-bottom: 1.25rem; }
    .options { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; }
    .option-btn { text-align: left; background: #243247; border: 1px solid var(--border); padding: 0.85rem 1rem; border-radius: 8px; font-size: 0.95rem; display: flex; align-items: center; gap: 0.75rem; }
    .option-btn.selected { border-color: var(--accent); background: #1e3a5f; }
    .key-badge { background: #1e293b; border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; color: var(--muted); }

    /* Results */
    .score-circle { text-align: center; margin: 1.5rem 0; font-size: 2.5rem; font-weight: 700; color: var(--accent); }
    .review-item { border-left: 3px solid var(--error); background: #162032; padding: 1rem; margin-bottom: 0.75rem; border-radius: 4px; font-size: 0.9rem; }
    .review-item.correct { border-left-color: var(--success); }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card" id="app">
    <!-- Setup Screen -->
    <div id="view-setup">
      <h1>Module Examination Drill</h1>
      <p class="subtitle">Select the number of randomized questions to drill.</p>
      <div class="btn-grid">
        <button onclick="startQuiz(10)">Quick 10</button>
        <button onclick="startQuiz(25)">Standard 25</button>
        <button onclick="startQuiz(50)">Deep Dive 50</button>
        <button onclick="startQuiz('all')">Full Bank</button>
      </div>
      <p id="pool-count" style="text-align: center; color: var(--muted); font-size: 0.85rem;"></p>
    </div>

    <!-- Quiz Screen -->
    <div id="view-quiz" class="hidden">
      <div class="meta">
        <span id="question-progress">Question 1 of 25</span>
        <span id="quiz-timer">00:00</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="question-title" id="question-text"></div>
      <div class="options" id="options-container"></div>
      <button class="primary" id="btn-next" onclick="submitAnswer()">Next Question</button>
    </div>

    <!-- Results Screen -->
    <div id="view-results" class="hidden">
      <h1>Session Complete</h1>
      <div class="score-circle" id="final-score">0%</div>
      <p class="subtitle" id="score-meta"></p>
      <button class="primary" style="margin-bottom: 1rem;" onclick="copyResult()">📋 Copy Score to Clipboard</button>
      <button onclick="location.reload()" style="width: 100%;">↻ Drill Again</button>
      
      <div style="margin-top: 1.5rem;">
        <h3 style="font-size: 1rem; margin-bottom: 0.75rem;">Missed Questions Review</h3>
        <div id="review-container"></div>
      </div>
    </div>
  </div>

  <script>
    let masterQuestions = [];
    let currentQuiz = [];
    let currentIndex = 0;
    let selectedOptionIndex = null;
    let userAnswers = [];
    let timerInterval = null;
    let secondsElapsed = 0;

    // Fetch master question pool
    fetch('questions.json')
      .then(res => res.json())
      .then(data => {
        masterQuestions = data;
        document.getElementById('pool-count').innerText = `${data.length} total questions available in pool.`;
      })
      .catch(err => {
        document.getElementById('pool-count').innerText = 'Make sure questions.json exists in root.';
      });

    function shuffle(array) {
      return array.map(v => ({ v, sort: Math.random() })).sort((a, b) => a.sort - b.sort).map(({ v }) => v);
    }

    function startQuiz(count) {
      if (!masterQuestions.length) return;
      
      // Shuffle master questions and slice requested count
      const shuffledQuestions = shuffle(masterQuestions);
      const totalToTake = count === 'all' ? shuffledQuestions.length : Math.min(count, shuffledQuestions.length);
      
      // Shuffle options for each selected question
      currentQuiz = shuffledQuestions.slice(0, totalToTake).map(item => {
        const correctText = item.options[item.answer];
        const shuffledOpts = shuffle([...item.options]);
        return {
          prompt: item.q,
          options: shuffledOpts,
          correctIndex: shuffledOpts.indexOf(correctText),
          explanation: item.explanation || ''
        };
      });

      currentIndex = 0;
      userAnswers = [];
      secondsElapsed = 0;

      document.getElementById('view-setup').classList.add('hidden');
      document.getElementById('view-quiz').classList.remove('hidden');

      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('quiz-timer').innerText = `${mins}:${secs}`;
      }, 1000);

      renderQuestion();
    }

    function renderQuestion() {
      selectedOptionIndex = null;
      const q = currentQuiz[currentIndex];
      
      document.getElementById('question-progress').innerText = `Question ${currentIndex + 1} of ${currentQuiz.length}`;
      document.getElementById('progress-fill').style.width = `${((currentIndex) / currentQuiz.length) * 100}%`;
      document.getElementById('question-text').innerText = q.prompt;

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="key-badge">${idx + 1}</span> <span>${opt}</span>`;
        btn.onclick = () => selectOption(idx);
        container.appendChild(btn);
      });

      document.getElementById('btn-next').innerText = currentIndex === currentQuiz.length - 1 ? 'Finish Quiz' : 'Next Question';
    }

    function selectOption(index) {
      selectedOptionIndex = index;
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach((btn, idx) => {
        btn.classList.toggle('selected', idx === index);
      });
    }

    function submitAnswer() {
      if (selectedOptionIndex === null) return alert('Please select an answer.');

      const currentQ = currentQuiz[currentIndex];
      userAnswers.push({
        question: currentQ.prompt,
        selected: selectedOptionIndex,
        correct: currentQ.correctIndex,
        options: currentQ.options,
        explanation: currentQ.explanation,
        isCorrect: selectedOptionIndex === currentQ.correctIndex
      });

      currentIndex++;
      if (currentIndex < currentQuiz.length) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    // Keyboard navigation (1-4 and Enter)
    window.addEventListener('keydown', (e) => {
      if (document.getElementById('view-quiz').classList.contains('hidden')) return;
      if (['1', '2', '3', '4'].includes(e.key)) {
        const index = parseInt(e.key) - 1;
        if (currentQuiz[currentIndex] && index < currentQuiz[currentIndex].options.length) {
          selectOption(index);
        }
      } else if (e.key === 'Enter') {
        submitAnswer();
      }
    });

    function finishQuiz() {
      clearInterval(timerInterval);
      document.getElementById('view-quiz').classList.add('hidden');
      document.getElementById('view-results').classList.remove('hidden');

      const correctCount = userAnswers.filter(a => a.isCorrect).length;
      const percentage = Math.round((correctCount / userAnswers.length) * 100);

      document.getElementById('final-score').innerText = `${percentage}%`;
      document.getElementById('score-meta').innerText = `You got ${correctCount} out of ${userAnswers.length} correct in ${Math.floor(secondsElapsed / 60)}m ${secondsElapsed % 60}s.`;

      const reviewContainer = document.getElementById('review-container');
      const missed = userAnswers.filter(a => !a.isCorrect);

      if (missed.length === 0) {
        reviewContainer.innerHTML = '<p style="color: var(--success);">Perfect score! No mistakes to review.</p>';
      } else {
        reviewContainer.innerHTML = missed.map(item => `
          <div class="review-item">
            <strong>${item.question}</strong><br/>
            <span style="color: var(--error);">Your answer: ${item.options[item.selected]}</span><br/>
            <span style="color: var(--success);">Correct answer: ${item.options[item.correct]}</span>
            ${item.explanation ? `<p style="color: var(--muted); margin-top: 4px; font-size: 0.8rem;">💡 ${item.explanation}</p>` : ''}
          </div>
        `).join('');
      }
    }

    function copyResult() {
      const correctCount = userAnswers.filter(a => a.isCorrect).length;
      const percentage = Math.round((correctCount / userAnswers.length) * 100);
      const text = `🎯 Scored ${correctCount}/${userAnswers.length} (${percentage}%) on the Module Drill in ${Math.floor(secondsElapsed / 60)}m ${secondsElapsed % 60}s!`;
      navigator.clipboard.writeText(text);
      alert('Score copied to clipboard!');
    }
  </script>
</body>
</html>
